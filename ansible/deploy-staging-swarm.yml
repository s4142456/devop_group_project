# Deploy the RMIT Store application to the staging host as a Docker Swarm
# stack. Requires that ansible/init-swarm.yml has been run against this host
# once to enable Swarm mode.
#
# Companion to ansible/deploy-staging.yml (which uses docker compose). Only
# one of the two should own the staging host at a time. To switch:
#   compose -> swarm: docker compose -f compose.staging.yml down --remove-orphans
#   swarm -> compose: docker stack rm rmit-store

---
- name: Deploy RMIT Store to staging (Docker Swarm)
  hosts: staging
  become: true
  vars:
    app_dir: /home/ec2-user/app
    stack_name: rmit-store
    ecr_registry: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com"
    backend_image: "{{ ecr_registry }}/meowgang/rmit-store-backend:{{ build_commit }}"
    frontend_image: "{{ ecr_registry }}/meowgang/rmit-store-frontend:{{ build_commit }}"

    # Django Host header allow-list — built from inventory. Private IP
    # covers internal probes; public IP covers user browsers. Overridable
    # via `-e allowed_hosts=...` (used by DEMO_STAGING_HEALTH_FAILURE).
    allowed_hosts: "127.0.0.1,localhost,{{ ansible_host }},{{ public_ip | default('') }}"

    # Absolute URL embedded in outbound email links (password reset, etc.).
    # Falls back to localhost if public_ip is empty — emails are cosmetic,
    # not a deploy blocker.
    client_url: "http://{{ public_ip | default('localhost') }}"

  tasks:
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Copy staging stack file to host
      ansible.builtin.copy:
        src: ../stack.staging.yml
        dest: "{{ app_dir }}/stack.staging.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'

    - name: Authenticate Docker to ECR
      ansible.builtin.shell: >-
        aws ecr get-login-password --region {{ aws_region }}
        | docker login --username AWS --password-stdin {{ ecr_registry }}
      changed_when: false
      no_log: true

    - name: Deploy the stack to Swarm
      ansible.builtin.command:
        chdir: "{{ app_dir }}"
        cmd: docker stack deploy -c stack.staging.yml {{ stack_name }} --with-registry-auth
      environment:
        POSTGRES_PASSWORD: "{{ postgres_password }}"
        SECRET_KEY: "{{ secret_key }}"
        ALLOWED_HOSTS: "{{ allowed_hosts }}"
        CLIENT_URL: "{{ client_url }}"
        BACKEND_IMAGE: "{{ backend_image }}"
        FRONTEND_IMAGE: "{{ frontend_image }}"
        APP_VERSION: "{{ app_version }}"
        GIT_COMMIT: "{{ build_commit }}"
      register: stack_deploy
      changed_when: "'Updating' in stack_deploy.stdout or 'Creating' in stack_deploy.stdout"
      no_log: true

    - name: Wait for all services to converge to their desired replicas
      ansible.builtin.shell: |
        set -e
        pending=$(docker service ls --filter label=com.docker.stack.namespace={{ stack_name }} \
          --format '{{ "{{" }}.Name{{ "}}" }} {{ "{{" }}.Replicas{{ "}}" }}' \
          | awk '{split($2,a,"/"); if (a[1] != a[2]) print $0}')
        if [ -n "$pending" ]; then
          echo "$pending"
          exit 1
        fi
        echo converged
      register: converge
      retries: 40
      delay: 5
      until: converge.rc == 0
      changed_when: false

    - name: Show final service state
      ansible.builtin.command: docker stack services {{ stack_name }}
      register: services
      changed_when: false

    - name: Print stack services
      ansible.builtin.debug:
        var: services.stdout_lines

    - name: Verify no application service is mid-rollback or paused
      # A converged replica count (previous task) does not prove the update
      # succeeded — Swarm reports 1/1 even while serving the *previous*
      # image during a rollback. Catch that here before trusting readyz.
      ansible.builtin.shell: >-
        docker service inspect rmit-store_{{ item }}
        --format '{{ "{{" }}if .UpdateStatus{{ "}}" }}{{ "{{" }}.UpdateStatus.State{{ "}}" }}{{ "{{" }}end{{ "}}" }}'
      register: update_state
      changed_when: false
      loop:
        - backend
        - frontend
      failed_when: "'rollback' in update_state.stdout or 'paused' in update_state.stdout"

    - name: Verify deployed image tag matches the build commit
      ansible.builtin.shell: >-
        docker service inspect rmit-store_{{ item }}
        --format '{{ "{{" }}.Spec.TaskTemplate.ContainerSpec.Image{{ "}}" }}'
      register: deployed_image
      changed_when: false
      failed_when: build_commit not in deployed_image.stdout
      loop:
        - backend
        - frontend

    - name: Wait for readiness endpoint (database + storage) via frontend
      # readyz, not healthz: healthz only proves the process is alive, not
      # that it can reach PostgreSQL or S3 — exactly the two dependencies
      # this deploy is meant to prove.
      ansible.builtin.uri:
        url: http://127.0.0.1/readyz/
        status_code: 200
        return_content: true
        body_format: json
      register: ready_check
      retries: 30
      delay: 5
      until: >-
        ready_check.status == 200 and
        ready_check.json.database == 'ok' and
        ready_check.json.storage == 'ok'

    - name: Report deployed version
      ansible.builtin.uri:
        url: http://127.0.0.1/api/version/
        return_content: true
      register: version_check

    - name: Fail unless the deployed commit matches what was requested
      ansible.builtin.assert:
        that:
          - (version_check.content | from_json).commit == build_commit
        fail_msg: >-
          Deployed commit {{ (version_check.content | from_json).commit }}
          does not match requested build_commit {{ build_commit }} —
          staging is not serving the release this deploy intended.
        success_msg: "Deployed commit matches build_commit ({{ build_commit }})."

    - name: Show deployed version
      ansible.builtin.debug:
        msg: "Staging (Swarm) deployed version: {{ version_check.content }}"
