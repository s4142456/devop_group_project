; RMIT University Vietnam
; Course: COSC2767|COSC2805 Systems Deployment and Operations
; Semester: 2026B
; Assessment: Assignment 2
;
; Production inventory: Docker Swarm (1 manager + 2 workers). The manager
; also runs the central monitoring stack; workers run only exporters.
;
; ansible_host = PRIVATE IP. REQUIRED — Jenkins SSHes via VPC private network.
;
; public_ip    = PUBLIC IP of the swarm manager (ingress endpoint). OPTIONAL.
;                Leave empty (public_ip=) and the deploy still succeeds — the
;                playbook falls back to a localhost-only ALLOWED_HOSTS +
;                CLIENT_URL, and the container's /healthz check on 127.0.0.1
;                still passes. Fill this in ONLY when you need:
;                  (a) users to browse the app via http://<public_ip>/, or
;                  (b) outbound email links to reach the real public URL.
;                Workers never need public_ip (swarm ingress lands on manager).

[swarm_manager]
meowgang-prod-swarm-manager ansible_host=172.31.31.88 public_ip=

[swarm_workers]
meowgang-prod-swarm-worker-1 ansible_host=172.31.24.127
meowgang-prod-swarm-worker-2 ansible_host=172.31.21.241

[production:children]
swarm_manager
swarm_workers

[all:vars]
ansible_user=ec2-user
