; RMIT University Vietnam
; Course: COSC2767|COSC2805 Systems Deployment and Operations
; Semester: 2026B
; Assessment: Assignment 2
;
; Production inventory: Docker Swarm (1 manager + 2 workers). The manager
; also runs the central monitoring stack; workers run only exporters.
;
; ansible_host = PRIVATE IP (Jenkins SSHes via VPC private network).
; public_ip    = PUBLIC IP of the swarm manager (ingress endpoint). Consumed
;                by ansible/deploy-prod-swarm.yml to build Django ALLOWED_HOSTS
;                + CLIENT_URL. Workers don't need public_ip.

[swarm_manager]
meowgang-prod-swarm-manager ansible_host=172.31.31.88 public_ip=

[swarm_workers]
meowgang-prod-swarm-worker-1 ansible_host=172.31.24.127
meowgang-prod-swarm-worker-2 ansible_host=172.31.21.241

[production:children]
swarm_manager
swarm_workers

[all:vars]
ansible_user=ec2-user
