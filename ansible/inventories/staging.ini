; RMIT University Vietnam
; Course: COSC2767|COSC2805 Systems Deployment and Operations
; Semester: 2026B
; Assessment: Assignment 2
;
; Staging inventory: single-node Docker Swarm host running the app.
;
; ansible_host = PRIVATE IP. REQUIRED — Jenkins SSHes via VPC private network.
;
; public_ip    = PUBLIC IP. OPTIONAL — leave empty (public_ip=) to still
;                deploy successfully. The deploy playbook falls back to a
;                localhost-only ALLOWED_HOSTS + CLIENT_URL, which is enough
;                because the container's /healthz check hits 127.0.0.1.
;                Fill this in ONLY when you need:
;                  (a) users to browse the app via http://<public_ip>/ without
;                      getting a Django 400 "Invalid HTTP_HOST", or
;                  (b) email links (password reset, order confirmation) to
;                      point at the real public URL.
;                Allocate an Elastic IP first so this value doesn't rotate.

[staging]
meowgang-store-staging ansible_host=172.31.8.77 public_ip=

[all:vars]
ansible_user=ec2-user
