; Staging inventory: single-node Docker Swarm host running the app.
;
; ansible_host = PRIVATE IP (Jenkins SSHes via VPC private network).
; public_ip    = PUBLIC IP. Consumed by ansible/deploy-staging-swarm.yml to
;                build Django ALLOWED_HOSTS + CLIENT_URL. Update after
;                launching the EC2 (or attach an Elastic IP so it doesn't
;                change on stop/start).

[staging]
meowgang-store-staging ansible_host=172.31.8.77 public_ip=

[all:vars]
ansible_user=ec2-user
