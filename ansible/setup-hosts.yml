---
- name: Configure Docker and System Prerequisites across all nodes
  hosts: all
  become: true
  tasks:
    - name: Ensure base utility packages are installed
      ansible.builtin.dnf:
        name:
          - git
        state: present

    - name: Install Docker
      ansible.builtin.dnf:
        name: docker
        state: present

    - name: Ensure Docker service is running and enabled
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    - name: Ensure Docker CLI plugins directory exists
      ansible.builtin.file:
        path: /usr/libexec/docker/cli-plugins
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install Docker Compose v2 plugin
      ansible.builtin.get_url:
        url: https://github.com/docker/compose/releases/download/v2.30.3/docker-compose-linux-x86_64
        dest: /usr/libexec/docker/cli-plugins/docker-compose
        owner: root
        group: root
        mode: '0755'

    - name: Create project workspace directory
      ansible.builtin.file:
        path: /home/ec2-user/app
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
