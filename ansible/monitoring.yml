# RMIT University Vietnam
# Course: COSC2767|COSC2805 Systems Deployment and Operations
# Semester: 2026B
# Assessment: Assignment 2
# Acknowledgement: Ansible documentation, Docker Compose documentation,
# Prometheus, Grafana, Loki, Promtail documentation.

# Provision the monitoring stack on a target host. Three roles:
#
#   role=central       Central Prometheus + Loki + Promtail + node_exporter +
#                      blackbox_exporter. Runs on the prod swarm manager
#                      (or, if env=staging, on the staging host).
#                      Grafana is NOT included here — it lives on a dedicated
#                      observability EC2 (role=grafana).
#
#   role=exporters     Only node_exporter + Promtail. Runs on prod swarm
#                      workers and on staging. Ships metrics/logs to central.
#
#   role=grafana       Only Grafana. Runs on the dedicated monitoring EC2.
#                      Datasources are templated to reach Prometheus and Loki
#                      on the prod swarm manager over the private network.
#
# env variable (staging|prod|monitoring) selects the correct Prometheus
# scrape config for the central role and labels for exporters.
#
# Required variables:
#   role, env, target_hosts (inventory group)
#   For role=exporters:  manager_private_ip
#   For role=grafana:    inventory must include [swarm_manager] group so the
#                        datasources template can look up its private IP.

---
- name: Provision monitoring stack
  hosts: "{{ target_hosts }}"
  become: true
  vars:
    monitoring_dir: /home/ec2-user/monitoring

  tasks:
    # --- Swap file (safety on t3.small; harmless on larger boxes) ---
    - name: Check whether /swapfile is already active
      ansible.builtin.command: swapon --show=NAME --noheadings
      register: active_swaps
      changed_when: false

    - name: Ensure swap file exists
      ansible.builtin.command: fallocate -l 2G /swapfile
      args:
        creates: /swapfile

    - name: Restrict permissions on swap file
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: '0600'

    - name: Format swap file
      ansible.builtin.command: mkswap /swapfile
      when: "'/swapfile' not in active_swaps.stdout"
      register: mkswap_result
      changed_when: "'Setting up swapspace' in (mkswap_result.stdout | default(''))"

    - name: Enable swap file
      ansible.builtin.command: swapon /swapfile
      when: "'/swapfile' not in active_swaps.stdout"
      register: swapon_result
      changed_when: swapon_result.rc == 0

    - name: Persist swap file in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: '/swapfile none swap sw 0 0'
        state: present

    - name: Persist vm.swappiness=10 sysctl setting
      ansible.builtin.copy:
        content: "vm.swappiness = 10\n"
        dest: /etc/sysctl.d/99-swappiness.conf
        owner: root
        group: root
        mode: '0644'
      register: swappiness_conf

    - name: Apply sysctl changes when swappiness setting changed
      ansible.builtin.command: sysctl --system
      when: swappiness_conf.changed
      changed_when: false

    # --- Common directory + shared configs on every monitored host ---
    - name: Ensure monitoring directory exists
      ansible.builtin.file:
        path: "{{ monitoring_dir }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    # ============================================================
    # ROLE: central (staging host or prod-swarm manager)
    # ============================================================
    - name: Copy central compose file
      ansible.builtin.copy:
        src: ../monitoring/compose.monitoring.yml
        dest: "{{ monitoring_dir }}/compose.monitoring.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      when: role == 'central'

    - name: Copy shared configs (loki, blackbox)
      ansible.builtin.copy:
        src: "../monitoring/shared/{{ item }}"
        dest: "{{ monitoring_dir }}/{{ item }}"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      loop:
        - loki-config.yml
        - blackbox.yml
      when: role == 'central'

    - name: Render shared promtail config (embeds env label)
      ansible.builtin.template:
        src: ../monitoring/shared/promtail-config.yml.j2
        dest: "{{ monitoring_dir }}/promtail-config.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      when: role == 'central'

    - name: Copy staging prometheus.yml
      ansible.builtin.copy:
        src: ../monitoring/staging/prometheus.yml
        dest: "{{ monitoring_dir }}/prometheus.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      when:
        - role == 'central'
        - env == 'staging'

    - name: Render prod prometheus.yml (embeds worker IPs)
      ansible.builtin.template:
        src: ../monitoring/prod/prometheus.yml.j2
        dest: "{{ monitoring_dir }}/prometheus.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      when:
        - role == 'central'
        - env == 'prod'

    - name: Start the central monitoring stack
      ansible.builtin.command:
        chdir: "{{ monitoring_dir }}"
        cmd: docker compose -f compose.monitoring.yml up -d --pull always --remove-orphans --force-recreate
      register: compose_up_central
      changed_when: "'Started' in compose_up_central.stderr or 'Recreated' in compose_up_central.stderr or 'Created' in compose_up_central.stderr"
      when: role == 'central'

    - name: Wait for Prometheus to be reachable
      ansible.builtin.uri:
        url: http://127.0.0.1:9090/-/ready
        status_code: 200
      register: prometheus_health
      retries: 30
      delay: 5
      until: prometheus_health.status == 200
      when: role == 'central'

    # ============================================================
    # ROLE: grafana (dedicated observability EC2)
    # ============================================================
    - name: Copy grafana compose file
      ansible.builtin.copy:
        src: ../monitoring/compose.grafana.yml
        dest: "{{ monitoring_dir }}/compose.grafana.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      when: role == 'grafana'

    - name: Copy Grafana dashboards + dashboard provider config
      ansible.builtin.copy:
        src: "../monitoring/grafana/{{ item }}"
        dest: "{{ monitoring_dir }}/grafana/{{ item }}"
        owner: ec2-user
        group: ec2-user
        directory_mode: '0755'
        mode: '0644'
      loop:
        - dashboards
        - provisioning/dashboards
      when: role == 'grafana'

    - name: Ensure Grafana datasources directory exists
      ansible.builtin.file:
        path: "{{ monitoring_dir }}/grafana/provisioning/datasources"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: '0755'
      when: role == 'grafana'

    - name: Render Grafana datasources (points at prod-manager Prometheus + Loki)
      ansible.builtin.template:
        src: ../monitoring/grafana/provisioning/datasources/datasources.yml.j2
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasources.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      when: role == 'grafana'

    - name: Start Grafana
      ansible.builtin.command:
        chdir: "{{ monitoring_dir }}"
        cmd: docker compose -f compose.grafana.yml up -d --pull always --remove-orphans --force-recreate
      register: compose_up_grafana
      changed_when: "'Started' in compose_up_grafana.stderr or 'Recreated' in compose_up_grafana.stderr or 'Created' in compose_up_grafana.stderr"
      when: role == 'grafana'

    - name: Wait for Grafana to be reachable
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/health
        status_code: 200
      register: grafana_health
      retries: 30
      delay: 5
      until: grafana_health.status == 200
      when: role == 'grafana'

    # ============================================================
    # ROLE: exporters (prod swarm workers, staging)
    # ============================================================
    - name: Copy exporters compose file
      ansible.builtin.copy:
        src: ../monitoring/exporters/compose.exporters.yml
        dest: "{{ monitoring_dir }}/compose.exporters.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      when: role == 'exporters'

    - name: Render worker promtail config (points at manager Loki)
      ansible.builtin.template:
        src: ../monitoring/exporters/promtail-config.yml.j2
        dest: "{{ monitoring_dir }}/promtail-config.yml"
        owner: ec2-user
        group: ec2-user
        mode: '0644'
      when: role == 'exporters'

    - name: Start the exporters stack
      ansible.builtin.command:
        chdir: "{{ monitoring_dir }}"
        cmd: docker compose -f compose.exporters.yml up -d --pull always --remove-orphans --force-recreate
      register: compose_up_exporters
      changed_when: "'Started' in compose_up_exporters.stderr or 'Recreated' in compose_up_exporters.stderr or 'Created' in compose_up_exporters.stderr"
      when: role == 'exporters'

    - name: Report central stack URLs
      ansible.builtin.debug:
        msg: "Central stack running on {{ ansible_host }} — Prometheus:9090, Loki:3100, blackbox:9115. Grafana lives on the dedicated observability EC2."
      when: role == 'central'

    - name: Report grafana URL
      ansible.builtin.debug:
        msg: "Grafana running on {{ ansible_host }}: http://<public-ip>:3000 (admin / RmitMonitor2767!)"
      when: role == 'grafana'

    - name: Report exporters running
      ansible.builtin.debug:
        msg: "Exporters running on {{ ansible_host }}: node_exporter:9100, promtail shipping to http://{{ manager_private_ip }}:3100"
      when: role == 'exporters'
