# Join a Docker Swarm worker to an existing manager. Idempotent: skips join
# if the node is already part of a swarm.
#
# Required variables:
#   target_hosts        inventory group (typically a single worker host)
#   manager_private_ip  the manager to join (its private IP)
#   join_token          the worker join token from the manager

---
- name: Join Docker Swarm worker
  hosts: "{{ target_hosts }}"
  become: true

  tasks:
    - name: Read Docker daemon swarm state
      ansible.builtin.command: docker info --format '{{ "{{" }}.Swarm.LocalNodeState{{ "}}" }}'
      register: swarm_state
      changed_when: false

    - name: Join the swarm as a worker
      ansible.builtin.command:
        cmd: docker swarm join --token {{ join_token }} {{ manager_private_ip }}:2377
      when: swarm_state.stdout != 'active'
      register: swarm_join

    - name: Report join state
      ansible.builtin.debug:
        msg: "Swarm state: {{ swarm_state.stdout }}. Worker joined manager {{ manager_private_ip }}."
