services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rmit_store_e2e
      POSTGRES_USER: rmit_e2e
      POSTGRES_PASSWORD: ci-only-postgres-password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rmit_e2e -d rmit_store_e2e
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ci-only-secret-key-not-used-outside-jenkins
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://rmit_e2e:ci-only-postgres-password@db:5432/rmit_store_e2e
      CLIENT_URL: http://127.0.0.1:5173
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      USE_S3: "False"
      APP_VERSION: "${APP_VERSION:-ci-local}"
      GIT_COMMIT: ${BUILD_COMMIT:-local}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py seed_demo
        --admin-email admin@rmit.edu.au
        --admin-password RmitStore2767!
        --demo-users &&
        gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 2
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/readyz/',
          timeout=3)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases:
          - rmit-store-backend

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
