services:
  db:
    image: postgres:16
    container_name: rmit-store-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rmit_store
      POSTGRES_USER: rmit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - rmit-store-db-data:/var/lib/postgresql/data
    networks:
      - rmit-store-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rmit -d rmit_store
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    container_name: rmit-store-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      DATABASE_URL: postgres://rmit:${POSTGRES_PASSWORD}@db:5432/rmit_store
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL must be set}
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      USE_S3: "True"
      AWS_STORAGE_BUCKET_NAME: meowgang-media-staging-01
      AWS_S3_REGION_NAME: us-east-1
      APP_VERSION: ${APP_VERSION:?APP_VERSION must be set}
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT must be set}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
    networks:
      - rmit-store-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/healthz/',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    container_name: rmit-store-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - rmit-store-net
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  rmit-store-db-data:

networks:
  rmit-store-net: