# Prometheus scrape config for the STAGING environment.
# Staging runs the entire application + monitoring on a single node, so
# host.docker.internal resolves to the same host as the Prometheus container.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: staging

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node_exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          host: staging

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal/healthz/
          - http://host.docker.internal/readyz/
          - http://host.docker.internal/api/version/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
