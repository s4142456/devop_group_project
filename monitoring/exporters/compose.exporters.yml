# Minimal exporters-only stack for production Swarm workers. The central
# Prometheus (on the manager) scrapes node-exporter here over the private
# network. Promtail ships this host's container logs to Loki on the manager.
# Deployed by ansible/monitoring.yml when role=exporters-only.

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter
    restart: unless-stopped
    mem_limit: 40m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    ports:
      - "9100:9100"

  promtail:
    image: grafana/promtail:3.2.1
    container_name: monitoring-promtail
    restart: unless-stopped
    mem_limit: 100m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail

volumes:
  promtail-data:
