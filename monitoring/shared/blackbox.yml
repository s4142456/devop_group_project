modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      follow_redirects: true
      # Override the Host header so Django accepts the request
      # (host.docker.internal is not in ALLOWED_HOSTS; 127.0.0.1 is).
      headers:
        Host: "127.0.0.1"
