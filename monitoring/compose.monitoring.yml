# Monitoring stack (Prometheus + Grafana + Loki + Promtail + node_exporter +
# blackbox_exporter). Sized to fit alongside the RMIT Store application on a
# t3.small (2 GB RAM). Deployed to /home/ec2-user/monitoring/ by
# ansible/monitoring.yml.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: monitoring-prometheus
    restart: unless-stopped
    mem_limit: 400m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=500MB
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: monitoring-grafana
    restart: unless-stopped
    mem_limit: 200m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: RmitMonitor2767!
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring-net
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.2.1
    container_name: monitoring-loki
    restart: unless-stopped
    mem_limit: 300m
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      # Bound to 0.0.0.0 so Swarm worker promtails can push over the private
      # network. Restrict inbound 3100 to the swarm private CIDR via SG.
      - "3100:3100"
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:3.2.1
    container_name: monitoring-promtail
    restart: unless-stopped
    mem_limit: 100m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    networks:
      - monitoring-net
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter
    restart: unless-stopped
    mem_limit: 40m
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host
    networks:
      - monitoring-net

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: monitoring-blackbox-exporter
    restart: unless-stopped
    mem_limit: 40m
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-net

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:

networks:
  monitoring-net:
