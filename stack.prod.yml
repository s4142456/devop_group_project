# RMIT University Vietnam
# Course: COSC2767/COSC2805 Systems Deployment and Operations
# Semester: 2026B
# Assessment: Assignment 2
# Acknowledgement: Docker Swarm mode documentation, Docker Compose file
# reference (Swarm-compatible subset).

# Docker Swarm stack for the PRODUCTION environment (3-node cluster: 1
# manager + 2 workers). Deploy with:
#   docker stack deploy -c stack.prod.yml rmit-store --with-registry-auth
#
# Deploy is driven by ansible/deploy-prod-swarm.yml, which sources the env
# variables from Jenkins credentials.
#
# Differences vs compose.prod.yml (kept as a fallback):
#   - container_name removed (Swarm names containers itself)
#   - depends_on.condition removed (Swarm ignores it; healthchecks + restart
#     policy handle startup ordering)
#   - restart: unless-stopped moved to deploy.restart_policy
#   - db pinned to the manager via placement.constraints (its volume follows)
#   - backend network alias 'rmit-store-backend' matches the upstream name
#     baked into client/nginx.conf so the frontend image works unchanged
#
# TODO: point AWS_STORAGE_BUCKET_NAME at a dedicated prod bucket
# (e.g. meowgang-media-prod-01) once it is provisioned.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rmit_store
      POSTGRES_USER: rmit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - rmit-store-db-data:/var/lib/postgresql/data
    networks:
      - rmit-store-net
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rmit -d rmit_store
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      replicas: 1
      placement:
        constraints:
          # Pin Postgres to the manager so its bind volume follows.
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: stop-first
        parallelism: 1
      rollback_config:
        order: stop-first
        parallelism: 1

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      DATABASE_URL: postgres://rmit:${POSTGRES_PASSWORD}@db:5432/rmit_store
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL must be set}
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      USE_S3: "True"
      AWS_STORAGE_BUCKET_NAME: meowgang-media-staging-01
      AWS_S3_REGION_NAME: us-east-1
      APP_VERSION: ${APP_VERSION:?APP_VERSION must be set}
      GIT_COMMIT: ${GIT_COMMIT:?GIT_COMMIT must be set}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers 3
    networks:
      # rmit-store-backend alias matches the upstream name baked into
      # client/nginx.conf, so the frontend image built for Compose keeps
      # resolving the backend under Swarm without a rebuild.
      rmit-store-net:
        aliases:
          - rmit-store-backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/healthz/',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set}
    ports:
      - "80:80"
    networks:
      - rmit-store-net
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
      rollback_config:
        order: stop-first
        parallelism: 1

volumes:
  rmit-store-db-data:

networks:
  rmit-store-net:
