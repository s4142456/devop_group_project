server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. A bare hostname in proxy_pass is resolved once
    # at config load, so nginx refuses to start if the backend task isn't
    # registered yet (a near-certainty on a fresh single-replica deploy,
    # since db/backend/frontend all start together). Routing proxy_pass
    # through a variable defers resolution to request time against this
    # resolver instead, so nginx always starts, and a request simply 502s
    # until the backend service is reachable rather than crashing the
    # container and burning through the whole restart budget.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_upstream http://rmit-store-backend:8000;
        proxy_pass $backend_upstream;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep deployment probes on the public application origin so load
    # balancers, smoke tests and operators do not need the backend port.
    location = /healthz/ {
        set $backend_upstream http://rmit-store-backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz/ {
        set $backend_upstream http://rmit-store-backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
