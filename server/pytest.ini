[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = tests
addopts =
    -ra
    --strict-markers
    --junitxml=reports/junit.xml
    --cov=apps
    --cov-report=term-missing
    --cov-report=xml:reports/coverage.xml
    --cov-report=html:reports/htmlcov